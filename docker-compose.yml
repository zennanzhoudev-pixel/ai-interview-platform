# 本地开发依赖。生产环境不使用本文件。
version: "3.9"

services:
  # 面试服务本体。
  #
  # 它被放在 compose 里而不是只跑"依赖", 因为本地起一套完整环境
  # (含 MySQL / Redis / 录制存储) 才是最容易复现线上问题的方式。
  interviewd:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/interview?parseTime=true&loc=UTC"
      REDIS_ADDR: "redis:6379"
      # 生产必须换成稳定密钥: 换掉它会让所有已发出的候选人链接失效。
      APP_SECRET: "local-dev-secret-change-me"
      TENANT_ID: "default"
      RECORDING_DIR: "/data/recordings"
      RECORDING_RETENTION_DAYS: "90"
      # 沙箱: 容器内没有 docker, 因此本机执行(仅本地开发)。
      # 生产请用 deployments/k8s 里的独立判题执行器。
      SANDBOX_ENGINE: "local"
      OTLP_ENDPOINT: "jaeger:4318"
      LOG_FORMAT: "json"
    ports: ["8080:8080"]
    volumes: ["recording-data:/data"]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: interview
    ports: ["3306:3306"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - "mysql-data:/var/lib/mysql"
      # 建表脚本与代码共用同一份(go:embed 也读它), 避免两份 DDL 不一致
      - "./internal/store/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports: ["9092:9092"]
    volumes: ["kafka-data:/bitnami/kafka"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.52.0
    ports: ["9090:9090"]
    volumes: ["./deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.0.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"

volumes:
  mysql-data:
  redis-data:
  es-data:
  kafka-data:
  recording-data:
