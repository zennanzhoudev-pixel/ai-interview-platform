<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>AI Interview OS · 线上面试中台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 页面骨架只有导航与一个挂载点:
       所有视图由 /js/app.js 里的路由渲染。这样做的理由是面试间、
       工作台、管理台共享同一套导航与状态, 用静态 HTML 复制三份外壳
       迟早会出现"改了一处忘了另一处"。 -->
  <header class="nav">
    <div class="nav-left">
      <button class="logo" id="navHome" title="回到首页" onclick="location.hash='/about'">
        <span class="logo-mark">OS</span>
        <span class="logo-text">AI Interview OS</span>
      </button>
    </div>
    <nav class="nav-center" id="navLinks"></nav>
    <div class="nav-right">
      <span class="pill warn" id="serviceStatus" hidden><i></i>服务未连接</span>
      <span id="shellSwitch"></span>
      <button class="nav-link ghost" onclick="location.hash='/about'">产品介绍</button>
      <div class="avatar-wrap">
        <button class="avatar-btn" id="avatarBtn" aria-haspopup="menu" aria-expanded="false" title="账户与设置">
          <span class="avatar" id="navAvatar">访</span>
        </button>
        <div class="menu" id="avatarMenu" hidden role="menu">
          <div class="menu-head">
            <strong id="menuName">访客</strong>
            <span class="muted small" id="menuRole">尚未连接</span>
          </div>
          <button class="menu-item" role="menuitem" data-action="console">招聘工作台</button>
          <button class="menu-item" role="menuitem" data-action="candidate">候选人空间</button>
          <button class="menu-item" role="menuitem" data-action="profile">我的报告</button>
          <button class="menu-item" role="menuitem" data-action="about">产品介绍</button>
          <button class="menu-item" role="menuitem" data-action="redetect">
            服务状态：<span id="menuService">重新检测</span>
          </button>
          <button class="menu-item" role="menuitem" data-action="signout">退出当前身份</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="foot">
    <span>AI Interview OS · 面试结论仅供参考, 录用决定由人做出并署名。</span>
    <span class="muted">若面试中出现网络中断, 重新打开链接即可从断点继续。</span>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
